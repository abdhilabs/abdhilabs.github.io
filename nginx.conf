# SPA hosting for the CRA build.
# Markdown posts live at /blog/*.md, so /blog is a real directory. Do not use
# `try_files $uri $uri/` — nginx then 301s to add a trailing slash. This
# container only listens on port 80, so that redirect is absolute http://
# when TLS ends at Cloudflare or the homelab proxy, and /blog/ 403s because
# the directory has no index file and autoindex is off.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    autoindex off;

    absolute_redirect off;
    port_in_redirect off;

    location / {
        try_files $uri $uri/index.html /index.html;
    }
}
